<!doctype html>
<!--
==================== 论文短片模板 · 怎么用 ====================

只改下面 <script> 里的 SC 数组,其余一律不动。

SC 是一组镜头,最多 5 个。每个镜头长这样:

  {
    head: "报告短名",            // 只在第一个镜头写,显示在左上角;可不写
    cast: [ 角色, 角色, ... ],   // 1 到 3 个角色,从左到右排
    flow: true,                  // 可不写。写了就在相邻角色之间画箭头,表示"交给""变成"
    mark: "?",                   // 可不写。右上角的大记号,只能是 "?" "!" "✓" "✗" 之一
    say:  "一句完整的大白话。"   // 字幕,不超过 28 个字
  }

角色长这样:{ who: "person", face: "think", tag: "读者" }

  who  用谁(只能用下面四个现成的):
       "person"  人:读者、用户、研究者、标注员,任何一个真人
       "robot"   机器:AI、模型、算法、自动打分的程序
       "paper"   纸:这篇论文、一份文档、一条数据、一份回答
       "box"     盒子:一个系统、一个工具、一套流程

  face 表情(只能用下面五个,要和这一格的意思对上):
       "calm"      平静:交代背景、陈述事实
       "think"     思考:提出问题、拿不准
       "sweat"     流汗:出问题了、办法不灵
       "surprise"  吃惊:意外的发现
       "smile"     笑:问题解决了、到结论了

  tag  角色脚下的小标签,说明它在这一格里是谁。不超过 6 个字,可不写。

页面底部有「模板自检」:镜头超过 5 个、字幕超过 28 个字、用了不存在的角色或表情,
都会用红字提示。交付前打开看一眼,没有红字才算过。

操作:点画面或按 → 下一格,按 ← 上一格,空格 播放/暂停。
================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文短片</title>
<style>
  :root {
    --bg: #f6f2e9; --card: #fffdf8; --ink: #2b2b2b; --muted: #8a8478;
    --line: #e4dccb; --accent: #e8743b; --warn: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1b18; --card: #fffdf8; --ink: #f1ece2; --muted: #a39c8f; --line: #3a362f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
  .stage { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    cursor: pointer; user-select: none; -webkit-user-select: none; }
  .stage svg { display: block; width: 100%; height: auto; }
  .scene { transition: opacity .35s ease; }
  .scene.out { opacity: 0; }
  .say { min-height: 3.4em; margin: 18px 4px 10px; font-size: clamp(20px, 3.4vw, 30px); line-height: 1.5;
    font-weight: 600; text-align: center; text-wrap: balance; transition: opacity .35s ease; }
  .say.out { opacity: 0; }
  .bar { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); border: 0; padding: 0; cursor: pointer; }
  .dot.on { background: var(--accent); }
  button.ctl { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button.ctl:hover { border-color: var(--accent); }
  .count { font-size: 13px; color: var(--muted); min-width: 3em; text-align: center; }
  .check { margin-top: 22px; padding: 12px 16px; border: 1px solid var(--warn); border-radius: 12px; color: var(--warn);
    font-size: 14px; line-height: 1.7; display: none; }
  .check.show { display: block; }
  .check b { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage" title="点一下看下一格">
    <svg id="svg" viewBox="0 0 960 440" role="img" aria-label="论文短片画面"></svg>
  </div>
  <div class="say" id="say"></div>
  <div class="bar">
    <button class="ctl" id="prev">上一格</button>
    <button class="ctl" id="play">暂停</button>
    <button class="ctl" id="next">下一格</button>
    <div class="dots" id="dots"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="check" id="check"></div>
</div>

<script>
/* ====================== 只改这里:SC 数组 ====================== */
const SC = [
  { head: "示例短片",
    cast: [ { who: "person", face: "think", tag: "读者" }, { who: "paper", face: "calm", tag: "一篇论文" } ],
    mark: "?",
    say: "一篇论文摆在面前,读者想知道它到底讲了什么。" },
  { cast: [ { who: "paper", face: "calm", tag: "论文" }, { who: "box", face: "calm", tag: "读论文的工具" }, { who: "person", face: "surprise", tag: "读者" } ],
    flow: true,
    say: "工具把论文拆开,用大白话重讲一遍。" },
  { cast: [ { who: "person", face: "smile", tag: "读者" } ],
    mark: "✓",
    say: "读者看懂了,还知道这和自己的工作有什么关系。" }
];
/* ====================== 以下一律不动 ====================== */

(function () {
  "use strict";
  var INK = "#2b2b2b", SEC = 4500, MAX_SCENES = 5, MAX_SAY = 28, MAX_TAG = 6;
  var WHO = ["person", "robot", "paper", "box"];
  var FACE = ["calm", "think", "sweat", "surprise", "smile"];
  var MARK = ["?", "!", "✓", "✗"];

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function len(s) { return Array.from(String(s == null ? "" : s)).length; }

  // 一张脸:以 (cx, cy) 为中心
  function face(kind, cx, cy) {
    function eye(dx, dy, r) { return '<circle cx="' + (cx + dx) + '" cy="' + (cy + dy) + '" r="' + (r || 5) + '" fill="' + INK + '"/>'; }
    function path(d, extra) { return '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" ' + (extra || "") + '/>'; }
    switch (kind) {
      case "smile":
        return path("M" + (cx - 26) + " " + (cy - 4) + " q8 -10 16 0") + path("M" + (cx + 10) + " " + (cy - 4) + " q8 -10 16 0") +
               path("M" + (cx - 18) + " " + (cy + 12) + " q18 18 36 0") +
               '<circle cx="' + (cx - 30) + '" cy="' + (cy + 12) + '" r="7" fill="#f6b9a6" opacity=".7"/>' +
               '<circle cx="' + (cx + 30) + '" cy="' + (cy + 12) + '" r="7" fill="#f6b9a6" opacity=".7"/>';
      case "sweat":
        return path("M" + (cx - 28) + " " + (cy - 18) + " l14 6") + path("M" + (cx + 28) + " " + (cy - 18) + " l-14 6") +
               eye(-18, -2) + eye(18, -2) +
               path("M" + (cx - 16) + " " + (cy + 20) + " q8 -9 16 0 q8 9 16 0") +
               '<path d="M' + (cx + 40) + " " + (cy - 40) + ' q11 17 0 25 q-11 -8 0 -25z" fill="#5aa9e6"/>';
      case "think":
        return eye(-14, -8) + eye(22, -8) + path("M" + (cx - 4) + " " + (cy + 18) + " h18") +
               '<circle cx="' + (cx + 50) + '" cy="' + (cy - 44) + '" r="4" fill="' + INK + '" opacity=".45"/>' +
               '<circle cx="' + (cx + 62) + '" cy="' + (cy - 58) + '" r="6" fill="' + INK + '" opacity=".45"/>' +
               '<circle cx="' + (cx + 78) + '" cy="' + (cy - 76) + '" r="9" fill="' + INK + '" opacity=".45"/>';
      case "surprise":
        return eye(-18, -6, 7) + eye(18, -6, 7) +
               '<ellipse cx="' + cx + '" cy="' + (cy + 20) + '" rx="8" ry="10" fill="' + INK + '"/>';
      default: // calm
        return eye(-18, -4) + eye(18, -4) + path("M" + (cx - 12) + " " + (cy + 16) + " q12 6 24 0");
    }
  }

  // 四个角色:都画在 200 x 240 的格子里
  function body(who, f) {
    var shadow = '<ellipse cx="100" cy="230" rx="56" ry="7" fill="#000" opacity=".08"/>';
    var st = 'stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"';
    switch (who) {
      case "robot":
        return shadow +
          '<line x1="100" y1="22" x2="100" y2="42" stroke="' + INK + '" stroke-width="4"/>' +
          '<circle cx="100" cy="16" r="8" fill="#e8743b" ' + st + '/>' +
          '<rect x="60" y="140" width="80" height="86" rx="14" fill="#b9c7e6" ' + st + '/>' +
          '<circle cx="100" cy="182" r="10" fill="#e8743b"/>' +
          '<rect x="44" y="42" width="112" height="96" rx="20" fill="#e3eaf8" ' + st + '/>' +
          face(f, 100, 88);
      case "paper":
        return shadow +
          '<path d="M44 22 H130 L160 52 V226 H44 Z" fill="#fffdf2" ' + st + '/>' +
          '<path d="M130 22 V52 H160" fill="#efe4c2" ' + st + '/>' +
          '<line x1="64" y1="160" x2="140" y2="160" stroke="#c9bfa5" stroke-width="5" stroke-linecap="round"/>' +
          '<line x1="64" y1="180" x2="140" y2="180" stroke="#c9bfa5" stroke-width="5" stroke-linecap="round"/>' +
          '<line x1="64" y1="200" x2="116" y2="200" stroke="#c9bfa5" stroke-width="5" stroke-linecap="round"/>' +
          face(f, 100, 100);
      case "box":
        return shadow +
          '<rect x="34" y="56" width="132" height="170" rx="18" fill="#dcf1e5" ' + st + '/>' +
          '<path d="M34 96 H166" ' + st + '/>' +
          '<circle cx="56" cy="76" r="6" fill="#e8743b"/><circle cx="76" cy="76" r="6" fill="#f2c14e"/><circle cx="96" cy="76" r="6" fill="#6fbf8e"/>' +
          face(f, 100, 150);
      default: // person
        return shadow +
          '<path d="M50 228 Q50 142 100 142 Q150 142 150 228 Z" fill="#f2c14e" ' + st + '/>' +
          '<circle cx="100" cy="88" r="52" fill="#fbe3cf" ' + st + '/>' +
          '<path d="M50 80 Q56 30 100 34 Q146 30 150 80 Q128 54 100 58 Q72 54 50 80 Z" fill="#5b4636"/>' +
          face(f, 100, 98);
    }
  }

  var SLOTS = { 1: [480], 2: [300, 660], 3: [190, 480, 770] };

  function drawScene(sc) {
    var cast = (sc.cast || []).slice(0, 3), xs = SLOTS[cast.length] || SLOTS[1], out = "";
    if (sc.flow) {
      for (var i = 0; i + 1 < xs.length; i++) {
        var a = xs[i] + 112, b = xs[i + 1] - 112;
        out += '<path d="M' + a + ' 210 H' + (b - 14) + '" stroke="#e8743b" stroke-width="6" stroke-linecap="round" fill="none"/>' +
               '<path d="M' + (b - 22) + ' 196 L' + b + ' 210 L' + (b - 22) + ' 224" stroke="#e8743b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
      }
    }
    cast.forEach(function (c, i) {
      var who = WHO.indexOf(c.who) >= 0 ? c.who : "person", f = FACE.indexOf(c.face) >= 0 ? c.face : "calm";
      out += '<g transform="translate(' + (xs[i] - 125) + ' 52) scale(1.25)">' + body(who, f) + "</g>";
      if (c.tag) out += '<text x="' + xs[i] + '" y="402" text-anchor="middle" font-size="26" fill="#6f695e">' + esc(c.tag) + "</text>";
    });
    if (sc.mark && MARK.indexOf(sc.mark) >= 0) {
      var good = sc.mark === "✓", badc = sc.mark === "✗" || sc.mark === "!";
      var col = good ? "#3f9d6b" : (badc ? "#c0392b" : "#e8743b");
      out += '<circle cx="884" cy="76" r="44" fill="' + col + '"/>' +
             '<text x="884" y="96" text-anchor="middle" font-size="58" font-weight="700" fill="#fff">' + esc(sc.mark) + "</text>";
    }
    return out;
  }

  // 模板自检
  function selfCheck() {
    var w = [];
    if (!Array.isArray(SC) || SC.length === 0) { w.push("SC 是空的,至少要有一个镜头。"); return w; }
    if (SC.length > MAX_SCENES) w.push("镜头有 " + SC.length + " 个,最多 " + MAX_SCENES + " 个。");
    SC.forEach(function (sc, i) {
      var n = "第 " + (i + 1) + " 个镜头:";
      if (!sc.say) w.push(n + "没有字幕。");
      else if (len(sc.say) > MAX_SAY) w.push(n + "字幕 " + len(sc.say) + " 个字,最多 " + MAX_SAY + " 个。");
      var cast = sc.cast || [];
      if (cast.length < 1 || cast.length > 3) w.push(n + "角色要 1 到 3 个,现在是 " + cast.length + " 个。");
      cast.forEach(function (c) {
        if (WHO.indexOf(c.who) < 0) w.push(n + "没有叫「" + esc(c.who) + "」的角色。");
        if (FACE.indexOf(c.face) < 0) w.push(n + "没有叫「" + esc(c.face) + "」的表情。");
        if (c.tag && len(c.tag) > MAX_TAG) w.push(n + "标签「" + esc(c.tag) + "」超过 " + MAX_TAG + " 个字。");
      });
      if (sc.mark && MARK.indexOf(sc.mark) < 0) w.push(n + "记号只能是 ? ! ✓ ✗ 之一。");
    });
    return w;
  }

  var svg = document.getElementById("svg"), sayEl = document.getElementById("say"),
      dots = document.getElementById("dots"), count = document.getElementById("count"),
      playBtn = document.getElementById("play"), checkEl = document.getElementById("check");
  var list = Array.isArray(SC) ? SC.slice(0, MAX_SCENES) : [];
  var head = list.length && list[0].head ? list[0].head : "";
  var cur = 0, timer = null, playing = true;
  if (head) document.title = head + " · 论文短片";

  function paint() {
    var sc = list[cur] || { cast: [], say: "" };
    svg.innerHTML = '<g class="scene">' +
      (head ? '<text x="32" y="46" font-size="24" fill="#8a8478">' + esc(head) + "</text>" : "") +
      drawScene(sc) + "</g>";
    sayEl.textContent = sc.say || "";
    Array.prototype.forEach.call(dots.children, function (d, i) { d.className = "dot" + (i === cur ? " on" : ""); });
    count.textContent = list.length ? (cur + 1) + " / " + list.length : "";
  }
  function show(i) {
    if (!list.length) return;
    cur = Math.max(0, Math.min(list.length - 1, i));
    var g = svg.querySelector(".scene");
    if (g) g.classList.add("out");
    sayEl.classList.add("out");
    setTimeout(function () { paint(); sayEl.classList.remove("out"); }, 180);
  }
  function stop() { playing = false; clearTimeout(timer); playBtn.textContent = cur >= list.length - 1 ? "重播" : "播放"; }
  function tick() {
    clearTimeout(timer);
    if (!playing) return;
    timer = setTimeout(function () {
      if (cur >= list.length - 1) { stop(); return; }
      show(cur + 1); tick();
    }, SEC);
  }
  function start() {
    if (cur >= list.length - 1) show(0);
    playing = true; playBtn.textContent = "暂停"; tick();
  }
  function step(d) { stop(); show(cur + d); setTimeout(function () { playBtn.textContent = cur >= list.length - 1 ? "重播" : "播放"; }, 200); }

  list.forEach(function (_, i) {
    var b = document.createElement("button");
    b.className = "dot"; b.setAttribute("aria-label", "第 " + (i + 1) + " 格");
    b.addEventListener("click", function () { stop(); show(i); });
    dots.appendChild(b);
  });
  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });
  document.getElementById("stage").addEventListener("click", function () { step(1); });
  playBtn.addEventListener("click", function () { if (playing) stop(); else start(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === " ") { e.preventDefault(); if (playing) stop(); else start(); }
  });

  var warns = selfCheck();
  if (warns.length) {
    checkEl.innerHTML = "<b>模板自检:有 " + warns.length + " 处要改</b>" + warns.join("<br>");
    checkEl.classList.add("show");
  }
  paint();
  if (list.length > 1) tick(); else stop();
})();
</script>
</body>
</html>
